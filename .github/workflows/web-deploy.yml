name: Web Deploy

# Builds and publishes the OPEN-CORE NetCrux read-only web viewer to
# app.netcrux.app.
#
# NetCrux had a `docs-site/`, a `web/` build and a `wrangler.jsonc` and no
# workflow that used any of them — `scripts/deploy_web.sh` ran on whichever
# machine an engineer happened to be sitting at. LintCrux
# and SimCrux both had a web-deploy workflow; this is the port.
#
# Adapted target. Those two publish to `gh-pages`; NetCrux's viewer is served by
# Cloudflare Workers Static Assets from `wrangler.jsonc` (Worker `netcrux-app`,
# custom domain app.netcrux.app), exactly as `scripts/deploy_web.sh` does it.
# Deploying to gh-pages here would have produced a second, silently-stale copy
# of the viewer on a hostname nothing points at.
#
# Manual-only, mirroring the suite's CI gating posture: the viewer ships
# open-core with no beta expiry, so a deploy reaches every user immediately and
# is a decision, not a side effect of a push.
#
# Credentials follow release-desktop.yml's convention — a CLOUDFLARE_API_TOKEN
# secret plus a CLOUDFLARE_ACCOUNT_ID variable — and the build runs even when
# they are absent, so the workflow still verifies that the web bundle builds on
# a fork or an unconfigured clone. Only the publish step is gated.
on:
  workflow_dispatch:
    inputs:
      base_href:
        description: "Base href for the deployed app (with trailing slash)"
        required: false
        default: "/"
      dry_run:
        description: "Build and smoke-test only — skip the Cloudflare deploy"
        type: boolean
        required: false
        default: false

concurrency:
  # A second deploy must never race the first onto the same Worker; queue
  # rather than cancel, so a run that already uploaded assets finishes.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy web viewer
    runs-on: ubuntu-latest
    # Cost guardrail: no job may run unbounded (max observed suite-wide is 29 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # crux-shared is a git submodule consumed via `path:` deps in
          # pubspec.yaml; without recursive checkout, `flutter pub get` fails
          # to resolve the shared packages (crux_yosys, crux_theme, ...).
          submodules: recursive
          # The crux-shared submodule is cloned with SUBMODULE_PAT (a read-only
          # Contents token) when the secret exists, and with the workflow token
          # otherwise — a fork's pull request has no secrets, and the public
          # submodule needs none.
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      # Refuse a deploy whose version disagrees with the beta flag compiled
      # from the pinned crux-shared. A dry run only warns. See scripts/check_beta_period.sh.
      - name: Beta flag matches the version
        timeout-minutes: 2
        run: ./scripts/check_beta_period.sh ${{ inputs.dry_run && '--advisory' || '' }}

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned, not tracked — keep in step with ci.yml and every other
          # workflow in the suite. See the note in ci.yml.
          flutter-version: '3.47.7'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-web-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-web-

      # The restored `.dart_tool/` carries build_runner's incremental asset
      # graph. A graph written before a file was deleted from a crux-shared
      # package fails codegen with `InvalidOutputException … Tried to delete
      # from package not in the build`. See ci.yml's analyze job.
      - name: Drop the restored build_runner asset graph
        shell: bash
        run: rm -rf .dart_tool/build

      - name: Install dependencies
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      # The layout engine: the vendored elkrs port compiled to WebAssembly
      # into web/wasm/, built from source for every deploy (not committed).
      - name: Install Rust (stable) with the wasm32 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack (pinned, checksum-verified)
        env:
          WASM_PACK_VERSION: '0.13.1'
          WASM_PACK_SHA256: 'c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539'
        run: |
          set -euo pipefail
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf wasm-pack.tar.gz "${name}/wasm-pack"
          install -D -m 0755 "${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      - name: Build the web layout engine + size gate
        run: dart run tool/build_web_wasm.dart

      - name: Build web bundle
        run: |
          flutter build web \
            --release \
            --base-href "${{ inputs.base_href }}"

      - name: Smoke-test the produced bundle
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/main.dart.js
          # Without these the viewer silently lays out on the elkjs fallback.
          test -f build/web/wasm/elk_wasm_worker.js
          test -f build/web/wasm/elk_wasm.js
          test -f build/web/wasm/elk_wasm_bg.wasm
          # The bundle must carry the locale data for all four CJK locales we
          # ship — a tree-shaking regression that dropped them would otherwise
          # only surface as English text in front of a user.
          for locale in ja ko zh; do
            grep -q "$locale" build/web/main.dart.js \
              || { echo "missing $locale locale in the web bundle"; exit 1; }
          done

      - name: Deploy to Cloudflare (netcrux-app -> app.netcrux.app)
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN secret and/or CLOUDFLARE_ACCOUNT_ID variable absent — the bundle was built and smoke-tested but NOT published."
            exit 0
          fi
          npx --yes wrangler@4.135.0 deploy
          echo "Deployed. Live at https://app.netcrux.app/"

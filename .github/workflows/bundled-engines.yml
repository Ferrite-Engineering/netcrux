name: Bundled Engines

# Composite workflow that downloads + caches the elaboration-engine
# binaries pinned in `tool/bundled_engines.yaml`. Manually invoked
# while the main CI is still on workflow_dispatch; the integration
# suite invokes this workflow as a `needs:` dependency once it gains
# bundled-binary integration tests.
#
# What this workflow IS:
#   - The reviewable version pin for every engine binary
#     (yosys, ghdl). There is no ghdl-yosys-plugin: VHDL is lowered by a
#     standalone `ghdl --synth` run, so no plugin is fetched or shipped.
#   - The fetch step that pre-populates the GitHub Actions per-OS
#     cache so subsequent runs reuse the cached binary instead of
#     re-downloading.
#   - The bridge that the integration test harness sets
#     `NETCRUX_BUNDLED_BIN_DIR` to via repository_dispatch / call once
#     the matrix lands.
#
# What this workflow is NOT (yet):
#   - It does not bundle binaries into the release build of the
#     Flutter app. That step lands when distribution packaging
#     activates; this workflow exists today so the *seam* — env var →
#     cached directory → BundledBinaryResolver — is exercised in CI
#     ahead of that milestone.

on:
  workflow_dispatch:
    inputs:
      engineFilter:
        description: "Which engine to fetch (yosys/ghdl/all)"
        required: false
        default: "all"

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch ${{ matrix.engine }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Cost guardrail: no job may run unbounded (max observed suite-wide is 29 min).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: yosys
            platform: linux-x86_64
            runner: ubuntu-latest
          - engine: yosys
            platform: macos-universal
            runner: macos-latest
          - engine: yosys
            platform: windows-x86_64
            runner: windows-latest
          - engine: ghdl
            platform: linux-x86_64
            runner: ubuntu-latest
          - engine: ghdl
            platform: macos-universal
            runner: macos-latest
          - engine: ghdl
            platform: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          # Same submodule token as every other workflow here: SUBMODULE_PAT
          # when the secret exists, the workflow token otherwise. This workflow
          # is dispatch-only, so a missing token would surface the first time a
          # bundled engine needs refreshing — the worst possible moment.
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Skip if engineFilter excludes this row
        if: ${{ inputs.engineFilter != 'all' && inputs.engineFilter != matrix.engine }}
        run: |
          echo "Skipping ${{ matrix.engine }} on ${{ matrix.platform }}"
          exit 0

      - name: Compute cache key
        id: cachekey
        shell: bash
        run: |
          # hashFiles() rather than `shasum`: shasum is a Perl script that
          # ships on the macOS and Ubuntu runners but is absent from Git Bash
          # on windows-latest, so this step exited 127 — command not found —
          # on every windows-x86_64 row while Linux and macOS sailed through.
          # hashFiles is evaluated by the runner, not the shell, so it is the
          # same value on all three platforms.
          echo "key=bundled-${{ matrix.engine }}-${{ matrix.platform }}-${{ hashFiles('tool/bundled_engines.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached binary
        id: cache-restore
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: bundled-bin/${{ matrix.platform }}/${{ matrix.engine }}*
          key: ${{ steps.cachekey.outputs.key }}

      - name: Read pinned version
        id: pin
        if: steps.cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          version=$(grep -A 1 "id: ${{ matrix.engine }}" tool/bundled_engines.yaml \
            | grep "version:" | head -1 | awk '{print $2}' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Engine-specific download. We keep this in-line per row so each
      # engine's archive format / executable layout is visible to the
      # reviewer. The actual release URLs are recorded in
      # `tool/bundled_engines.yaml`; we use the system package manager
      # where possible since OSS-CAD-Suite tarballs are large.
      - name: Download Yosys (linux)
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' && matrix.engine == 'yosys' && matrix.platform == 'linux-x86_64' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yosys
          mkdir -p bundled-bin/${{ matrix.platform }}
          cp "$(which yosys)" bundled-bin/${{ matrix.platform }}/yosys

      - name: Download Yosys (macOS)
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' && matrix.engine == 'yosys' && matrix.platform == 'macos-universal' }}
        run: |
          brew install yosys
          mkdir -p bundled-bin/${{ matrix.platform }}
          cp "$(which yosys)" bundled-bin/${{ matrix.platform }}/yosys

      - name: Download GHDL (linux)
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' && matrix.engine == 'ghdl' && matrix.platform == 'linux-x86_64' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ghdl
          mkdir -p bundled-bin/${{ matrix.platform }}
          cp "$(which ghdl)" bundled-bin/${{ matrix.platform }}/ghdl

      - name: Download GHDL (macOS)
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' && matrix.engine == 'ghdl' && matrix.platform == 'macos-universal' }}
        run: |
          brew install ghdl || true
          if [ -x "$(command -v ghdl)" ]; then
            mkdir -p bundled-bin/${{ matrix.platform }}
            cp "$(which ghdl)" bundled-bin/${{ matrix.platform }}/ghdl
          else
            echo "::warning::ghdl not available via Homebrew on this runner"
          fi

      - name: Generic skip notice for unsupported (engine, platform) cells
        if: ${{ steps.cache-restore.outputs.cache-hit != 'true' && matrix.platform == 'windows-x86_64' }}
        run: |
          echo "::warning::No automated bundled-binary URL for ${{ matrix.engine }} on ${{ matrix.platform }} yet — manifest entry in tool/bundled_engines.yaml documents the planned source."

      - name: Save artifact
        if: ${{ always() && hashFiles(format('bundled-bin/{0}/*', matrix.platform)) != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bundled-${{ matrix.engine }}-${{ matrix.platform }}
          path: bundled-bin/${{ matrix.platform }}/*
          retention-days: 14

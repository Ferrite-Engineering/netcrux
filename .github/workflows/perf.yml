name: Performance

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Robustness & performance benchmarks:
# ELK layout pipeline timing, schematic paint timing (culled vs no-cull), and
# ingestion parse time + peak RSS per design tier. All three are wall-clock
# measurements — machine-dependent and unsuited to gating a shared CI runner —
# so this job records the numbers as an artifact rather than asserting a tight
# threshold. It catches *breakage* (a benchmark that throws) on every run; the
# golden sweep + static fixture-discipline guards already run in the default
# `test` job in ci.yml (they are plain `*_test.dart` with deterministic
# assertions), so that signal is on every commit already.
#
# Nightly + manual, matching the suite convention (ci.yml runs the same way
# while push/PR triggers are disabled during stabilization).
on:
  workflow_dispatch:
  schedule:
    # Nightly at 11 PM Mountain Time. Cron runs in UTC and does NOT follow
    # DST: 05:00 UTC = 23:00 MDT (summer) / 22:00 MST (winter). Matches ci.yml.
    - cron: '20 2 * * *'

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (recorded)
    runs-on: ubuntu-latest
    # Cost guardrail: no job may run unbounded (max observed suite-wide is 29 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # crux-shared is a git submodule consumed via `path:` deps in
          # pubspec.yaml; without recursive checkout, `flutter pub get` fails
          # to resolve the shared packages (crux_yosys, crux_theme, ...).
          submodules: recursive
          # The crux-shared submodule is cloned with SUBMODULE_PAT (a read-only
          # Contents token) when the secret exists, and with the workflow token
          # otherwise — a fork's pull request has no secrets, and the public
          # submodule needs none.
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/elk_ffi/target
          key: rust-ubuntu-latest-${{ hashFiles('native/elk_ffi/Cargo.lock') }}
          restore-keys: rust-ubuntu-latest-

      # The desktop layout engine. The native tests and the parity gate call
      # requireElkFfiLibrary (test/helpers/elk_ffi_library_gate.dart), which
      # skips locally without the library but fails under CI=true, so a
      # missing build here turns red rather than quietly skipping the gate.
      - name: Build the layout engine (Rust)
        working-directory: native/elk_ffi
        run: cargo build --release

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-ubuntu-bench-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-ubuntu-bench-

      - name: Install dependencies
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Fixtures regenerate (no source drift)
        run: dart run tool/generate_netlist_fixtures.dart --tier committed

      - name: Goldens still match the live parser
        # The golden test recomputes each committed design's golden from the
        # parser and diffs it; a fixtures/parser drift fails here.
        run: flutter test test/services/yosys/netlist_golden_test.dart

      # Each benchmark is invoked by its exact file path so the runner picks
      # it up regardless of the `*_test.dart` discovery glob applied to
      # directory arguments — a `flutter test test/benchmarks/` directory
      # invocation silently skips any file not ending in `_test.dart`. All
      # files below carry the `RUN_BENCHMARKS` compile-time gate so
      # `flutter test` (no args, in the default `test` job) still discovers
      # and immediately skips them.
      - name: Ingest benchmark — parse time + peak RSS per design tier
        run: >
          flutter test --dart-define=RUN_BENCHMARKS=true
          test/perf/ingest_bench_test.dart

      - name: ELK layout benchmark — chain_1k / chain_10k
        run: >
          flutter test --dart-define=RUN_BENCHMARKS=true
          test/benchmarks/elk_layout_bench_test.dart

      - name: Schematic paint benchmark — 500/1000/5000 cells, culled vs no-cull
        run: >
          flutter test --dart-define=RUN_BENCHMARKS=true
          test/benchmarks/schematic_paint_bench_test.dart

      - name: Scene index benchmark — frame, click and keystroke at 100k cells
        run: >
          flutter test --dart-define=RUN_BENCHMARKS=true
          test/benchmarks/schematic_spatial_bench_test.dart

      - name: Upload recorded perf numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netcrux-perf
          path: build/perf/
          retention-days: 7

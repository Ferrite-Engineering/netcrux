site_name: NetCrux Documentation
site_url: https://docs.netcrux.app/
site_description: The complete NetCrux user guide — installation, the interface, elaborating RTL, navigating the schematic, tracing signals, structural analysis, custom symbols, and cross-probe.
copyright: Copyright &copy; 2026 Ferrite Engineering LLC
use_directory_urls: false
docs_dir: docs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    # Dark first, matching the marketing site; the toggle offers light.
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
extra:
  homepage: https://netcrux.app
extra_css:
  - assets/brand.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
nav:
  - Getting started:
      - Overview: index.md
      - Installation & first elaboration: getting-started.md
      - The interface: interface.md
      - Appearance & themes: appearance-and-themes.md
      - Keyboard & mouse reference: keyboard-mouse.md
      - Tiers & licensing: licensing.md
      - Updates, issues & privacy: user-guide/updates-and-feedback.md
      - Command-line usage: cli/usage.md
      - Web viewer: web-mode.md
  - Working with schematics:
      - Sources, projects & sessions: files-and-projects.md
      - Session file format: reference/session-format.md
      - Navigating the schematic: navigating.md
      - Tracing signals: tracing.md
      - Structural analysis: analysis.md
      - Inspector & RTL source: source-and-inspection.md
  - Customize & integrate:
      - Custom cell symbols: customizing.md
      - Bookmarks & annotations: bookmarks.md
      - Cross-probe & the suite: integrations.md
      - CXP integration reference: integrations/cxp.md
      - Use in VS Code: vscode.md
  - Administration:
      - Org-wide configuration: administration.md
      - Policy file reference: https://edacrux.app/policy-reference
      - Audit log: https://edacrux.app/audit-log
      - Deployment: https://edacrux.app/deployment
  - Cookbook:
      - Workflow recipes: cookbook.md
      - Trace a signal to its source: cookbook-trace-a-signal.md
      - Diff two RTL revisions: cookbook-diff-revisions.md
      - Triage a CDC crossing: cookbook-cdc-triage.md
      - Make a custom symbol: cookbook-custom-symbol.md
      - Understand an unfamiliar module: cookbook/explore-unfamiliar-rtl.md
      - Share a schematic in a review: cookbook/share-a-view.md
      - Cross-probe from a waveform: cookbook/cross-probe-from-waveform.md
